name: Read AI-PDM production diagnostics

on:
  workflow_dispatch:
    inputs:
      operationRef:
        description: Immutable RD permission-state or service-state operation with sha256 fragment
        required: true
        type: string

concurrency:
  group: production-release-ai-pdm-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  WIF_PROVIDER: projects/9536592944/locations/global/workloadIdentityPools/jenfu-prod-release/providers/aipdm-github

jobs:
  inspect:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.bind.outputs.kind }}
      operation_uri: ${{ steps.bind.outputs.operation_uri }}
      operation_sha256: ${{ steps.bind.outputs.operation_sha256 }}
    permissions: { contents: read, checks: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24.11.0", cache: npm }
      - run: npm ci
      - name: Verify exact merged source and required CI results
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: node scripts/dev012-verify-official-source.mjs
      - id: bind
        env: { OPERATION_REF: "${{ inputs.operationRef }}" }
        run: node scripts/dev117-production-diagnostics.mjs --bind
      - id: deployer_auth
        if: steps.bind.outputs.kind == 'rd-permission-state'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-deployer@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - id: verifier_auth
        if: steps.bind.outputs.kind == 'service-state'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-verifier@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - name: Execute fixed read-only permission state readback
        if: steps.bind.outputs.kind == 'rd-permission-state'
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.deployer_auth.outputs.access_token }}"
        run: node scripts/dev122-rd-permission-state-readback.mjs --stage readback --permission-operation-ref "${{ steps.bind.outputs.operation_uri }}" --permission-operation-sha256 "${{ steps.bind.outputs.operation_sha256 }}" --source-revision "$GITHUB_SHA" --permission-output-ref "gs://jenfu-platform-prod-aipdm-release/receipts/releases/DEV122-RD-PERMISSION-READBACK/${{ steps.bind.outputs.operation_sha256 }}/state.json"
      - name: Read fixed AI-PDM service state
        if: steps.bind.outputs.kind == 'service-state'
        env:
          OPERATION_REF: "${{ inputs.operationRef }}"
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.verifier_auth.outputs.access_token }}"
        run: node scripts/dev117-production-diagnostics.mjs --service-state

