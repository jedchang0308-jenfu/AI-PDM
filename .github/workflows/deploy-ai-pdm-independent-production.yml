name: Deploy AI-PDM independently

on:
  workflow_dispatch:
    inputs:
      releaseCapsuleRef:
        description: Immutable AI-PDM release-intent URI with sha256 fragment
        required: true
        type: string
      executionMode:
        description: Build immutable artifacts for prerequisites, or complete the owner release
        required: true
        type: choice
        default: full_release
        options: [full_release, build_only]

concurrency:
  group: production-release-ai-pdm-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24.11.0"
  OWNER_EXECUTION_MODE: "${{ inputs.executionMode }}"
  PDM_ENFORCE_DAILY_MODE_BOUNDARY: "true"
  WIF_PROVIDER: ${{ vars.AIPDM_PROD_WIF_PROVIDER }}

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, pull-requests: read, checks: read, id-token: write }
    outputs:
      capsule_uri: ${{ steps.bind.outputs.capsule_uri }}
      capsule_sha256: ${{ steps.bind.outputs.capsule_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24.11.0", cache: npm }
      - run: npm ci
      - name: Verify exact merged source and required CI results
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: node scripts/dev012-verify-official-source.mjs
      - id: bind
        shell: bash
        env: { RELEASE_CAPSULE_REF: "${{ inputs.releaseCapsuleRef }}", EXECUTION_MODE: "${{ inputs.executionMode }}" }
        run: |
          set -euo pipefail
          case "$EXECUTION_MODE" in full_release|build_only) ;; *) exit 1 ;; esac
          capsule_uri="${RELEASE_CAPSULE_REF%%#sha256=*}"
          capsule_sha256="${RELEASE_CAPSULE_REF##*#sha256=}"
          test "$capsule_uri" != "$RELEASE_CAPSULE_REF"
          [[ "$capsule_uri" =~ ^gs://jenfu-platform-prod-aipdm-release/receipts/.+\.json$ ]]
          [[ "$capsule_sha256" =~ ^[a-f0-9]{64}$ ]]
          echo "capsule_uri=$capsule_uri" >> "$GITHUB_OUTPUT"
          echo "capsule_sha256=$capsule_sha256" >> "$GITHUB_OUTPUT"
      - id: verifier_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-verifier@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: proof_builder_read_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-builder@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: migration_execution_read_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-deployer@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Execute prepare
        env:
          AIPDM_MIGRATION_EXECUTION_READ_TOKEN: "${{ steps.migration_execution_read_auth.outputs.access_token }}"
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.verifier_auth.outputs.access_token }}"
          AIPDM_OWNER_PROOF_BUILDER_READ_TOKEN: "${{ steps.proof_builder_read_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage prepare --capsule-ref "${{ steps.bind.outputs.capsule_uri }}" --capsule-sha256 "${{ steps.bind.outputs.capsule_sha256 }}"

  build:
    name: build
    needs: preflight
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24.11.0", cache: npm }
      - run: npm ci
      - id: builder_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-builder@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: build_verifier_read_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-verifier@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Execute build
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.builder_auth.outputs.access_token }}"
          AIPDM_BUILD_VERIFIER_READ_TOKEN: "${{ steps.build_verifier_read_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage build --capsule-ref "${{ needs.preflight.outputs.capsule_uri }}" --capsule-sha256 "${{ needs.preflight.outputs.capsule_sha256 }}"

  migrate:
    name: migrate-if-needed
    if: ${{ inputs.executionMode == 'full_release' }}
    needs: [preflight, build]
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24.11.0", cache: npm }
      - run: npm ci
      - id: deployer_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-deployer@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: proof_builder_read_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-builder@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Execute migrate
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.deployer_auth.outputs.access_token }}"
          AIPDM_OWNER_PROOF_BUILDER_READ_TOKEN: "${{ steps.proof_builder_read_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage migrate --capsule-ref "${{ needs.preflight.outputs.capsule_uri }}" --capsule-sha256 "${{ needs.preflight.outputs.capsule_sha256 }}"

  candidate-smoke:
    name: candidate-smoke
    needs: [preflight, migrate]
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24.11.0", cache: npm }
      - run: npm ci
      - id: deployer_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-deployer@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: proof_builder_read_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-builder@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Execute candidate
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.deployer_auth.outputs.access_token }}"
          AIPDM_OWNER_PROOF_BUILDER_READ_TOKEN: "${{ steps.proof_builder_read_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage candidate --capsule-ref "${{ needs.preflight.outputs.capsule_uri }}" --capsule-sha256 "${{ needs.preflight.outputs.capsule_sha256 }}"
      - name: Configure direct Cloud Run entrypoint
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.deployer_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage entrypoint --capsule-ref "${{ needs.preflight.outputs.capsule_uri }}" --capsule-sha256 "${{ needs.preflight.outputs.capsule_sha256 }}"
      - id: verifier_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-verifier@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Execute verify
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.verifier_auth.outputs.access_token }}"
          AIPDM_OWNER_PROOF_BUILDER_READ_TOKEN: "${{ steps.proof_builder_read_auth.outputs.access_token }}"
          DEV012_AIPDM_FIREBASE_REFRESH_TOKEN: "${{ secrets.DEV012_AIPDM_FIREBASE_REFRESH_TOKEN }}"
          DEV012_AIPDM_FIREBASE_API_KEY: "${{ secrets.DEV012_AIPDM_FIREBASE_API_KEY }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage verify --capsule-ref "${{ needs.preflight.outputs.capsule_uri }}" --capsule-sha256 "${{ needs.preflight.outputs.capsule_sha256 }}"
      - name: Execute decision
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.verifier_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage decision --capsule-ref "${{ needs.preflight.outputs.capsule_uri }}" --capsule-sha256 "${{ needs.preflight.outputs.capsule_sha256 }}"

  activate-readback:
    name: activate-readback
    needs: [preflight, candidate-smoke]
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24.11.0", cache: npm }
      - run: npm ci
      - id: deployer_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-deployer@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: proof_builder_read_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-builder@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Execute activate
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.deployer_auth.outputs.access_token }}"
          AIPDM_OWNER_PROOF_BUILDER_READ_TOKEN: "${{ steps.proof_builder_read_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage activate --capsule-ref "${{ needs.preflight.outputs.capsule_uri }}" --capsule-sha256 "${{ needs.preflight.outputs.capsule_sha256 }}"
      - id: verifier_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-verifier@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Execute canonical
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.verifier_auth.outputs.access_token }}"
          DEV012_AIPDM_FIREBASE_REFRESH_TOKEN: "${{ secrets.DEV012_AIPDM_FIREBASE_REFRESH_TOKEN }}"
          DEV012_AIPDM_FIREBASE_API_KEY: "${{ secrets.DEV012_AIPDM_FIREBASE_API_KEY }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage canonical --capsule-ref "${{ needs.preflight.outputs.capsule_uri }}" --capsule-sha256 "${{ needs.preflight.outputs.capsule_sha256 }}"
      - name: Execute finalize
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.deployer_auth.outputs.access_token }}"
          AIPDM_OWNER_PROOF_BUILDER_READ_TOKEN: "${{ steps.proof_builder_read_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage finalize --capsule-ref "${{ needs.preflight.outputs.capsule_uri }}" --capsule-sha256 "${{ needs.preflight.outputs.capsule_sha256 }}"

  failure:
    if: ${{ always() && inputs.executionMode == 'full_release' && needs.preflight.result == 'success' && contains(needs.*.result, 'failure') }}
    needs: [preflight, build, migrate, candidate-smoke, activate-readback]
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24.11.0", cache: npm }
      - run: npm ci
      - id: deployer_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-deployer@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: proof_builder_read_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-builder@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Read back, roll back own traffic if needed, and publish terminal receipt
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.deployer_auth.outputs.access_token }}"
          AIPDM_OWNER_PROOF_BUILDER_READ_TOKEN: "${{ steps.proof_builder_read_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage rollback --capsule-ref "${{ needs.preflight.outputs.capsule_uri }}" --capsule-sha256 "${{ needs.preflight.outputs.capsule_sha256 }}"
