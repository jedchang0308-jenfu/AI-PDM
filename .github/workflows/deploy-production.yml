name: AI PDM Production Deploy

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact 40-character commit currently at main
        required: true
        type: string
      approval:
        description: Type DEPLOY-AI-PDM-PRODUCTION
        required: true
        type: string
      reason:
        description: Release reason or incident reference
        required: true
        type: string
      stage:
        description: candidate deploys with 0% traffic; promote requires current Level 4 and Wave 0 approval
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - promote
      candidate_revision:
        description: Required for promote; exact candidate Cloud Run revision from the candidate run
        required: false
        type: string
      level4_evidence_ref:
        description: Required for promote; production-candidate://<candidate_revision>/<release_commit>/<immutable-id>
        required: false
        type: string
      wave0_users:
        description: Required for promote when wave0_mode=tested; comma-separated 3-5 named Workspace users who completed Wave 0
        required: false
        type: string
      wave0_mode:
        description: Promote gate mode; tested requires 3-5 users, waived requires a bound risk-acceptance record
        required: false
        default: tested
        type: choice
        options:
          - tested
          - waived
      wave0_waiver_ref:
        description: Required when wave0_mode=waived; WAVE0-WAIVER://<candidate_revision>/<release_commit>/<immutable-id>
        required: false
        type: string
      product_owner_decision:
        description: Required for promote; type go only after product-owner review
        required: false
        type: string
      promotion_approval:
        description: Required for promote; type AI-PDM-PRODUCTION-PROMOTION-APPROVED
        required: false
        type: string

concurrency:
  group: ai-pdm-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact release commit
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0

      - name: Fail closed on stale or ambiguous source
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_APPROVAL: ${{ inputs.approval }}
          RELEASE_STAGE: ${{ inputs.stage }}
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/main") { throw "Workflow must be dispatched from main." }
          if ($env:RELEASE_APPROVAL -ne "DEPLOY-AI-PDM-PRODUCTION") { throw "Exact production approval text is missing." }
          if ($env:RELEASE_STAGE -notin @("candidate", "promote")) { throw "Release stage must be candidate or promote." }
          if ($env:RELEASE_COMMIT -notmatch '^[a-f0-9]{40}$') { throw "Release commit must be a lowercase 40-character SHA." }
          $head = (git rev-parse HEAD).Trim()
          $remoteMain = ((git ls-remote origin refs/heads/main) -split "`t")[0].Trim()
          if ($head -ne $env:RELEASE_COMMIT) { throw "Checked-out commit does not match release input." }
          if ($remoteMain -ne $env:RELEASE_COMMIT) { throw "Release input is not the current remote main commit." }
          if (git status --porcelain) { throw "Release worktree is not clean." }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject high or critical production dependency findings
        run: npm audit --omit=dev --audit-level=high

      - name: Verify production release boundary
        run: |
          $env:PDM_QC_PHASE2B_SKIP_STAGING_PREFLIGHT = "true"
          npm run qc:dev-046-phase2b
          npm run qc:request-origin
          npm run qc:dev-070-privacy-removal
          npm run qc:pdm-account-invitations
          npm run qc:dev-032-production-iac-package
          npm run qc:production-deployment-pipeline
          npm run build

  candidate:
    name: Build, deploy, and smoke zero-traffic candidate
    if: ${{ inputs.stage == 'candidate' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: https://jenfu-ai-pdm-prod.web.app
    permissions:
      contents: read
      id-token: write
    outputs:
      candidate_revision: ${{ steps.candidate.outputs.candidate_revision }}
      candidate_url: ${{ steps.candidate.outputs.candidate_url }}
      image_digest: ${{ steps.image.outputs.digest }}
      migration_image_digest: ${{ steps.migration_image.outputs.digest }}
    env:
      GCP_PROJECT_ID: jenfu-ai-pdm-prod
      GCP_PROJECT_NUMBER: "451715062958"
      GCP_REGION: asia-east1
      CLOUD_RUN_SERVICE: ai-pdm-prod
      APPLICATION_CONTAINER: ai-pdm
      IMAGE_PATH: asia-east1-docker.pkg.dev/jenfu-ai-pdm-prod/ai-pdm/ai-pdm
      MIGRATION_IMAGE_PATH: asia-east1-docker.pkg.dev/jenfu-ai-pdm-prod/ai-pdm/ai-pdm-migration
      CANONICAL_BASE_URL: https://jenfu-ai-pdm-prod.web.app
      WIF_PROVIDER: projects/451715062958/locations/global/workloadIdentityPools/github-actions/providers/ai-pdm-production
      DEPLOYER_SERVICE_ACCOUNT: ai-pdm-prod-deployer@jenfu-ai-pdm-prod.iam.gserviceaccount.com
      PDM_PRODUCTION_RELEASE_TRAFFIC_APPROVAL: AI-PDM-PRODUCTION-RELEASE-TRAFFIC-APPROVED
      PDM_PRODUCTION_PROJECT_ID: jenfu-ai-pdm-prod
      PDM_PRODUCTION_REGION: asia-east1
      PDM_PRODUCTION_SERVICE: ai-pdm-prod
      CANDIDATE_RUNTIME_FLAGS: PDM_NUMBER_STATE_FLOW_V1=true,PDM_NUMBER_LIFECYCLE_V2=true,PDM_UNIFIED_DRAWING_WORKBENCH_V1=true,PDM_UNIFIED_PART_RELATION_WORKBENCH_V1=true,PDM_UNIFIED_ENTITY_DETAIL_V1=true,PDM_DRAWING_REVISION_LIFECYCLE_MODE=enforced
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0

      - name: Reconfirm source provenance
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_APPROVAL: ${{ inputs.approval }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$RELEASE_APPROVAL" == "DEPLOY-AI-PDM-PRODUCTION" ]]
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_COMMIT" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$RELEASE_COMMIT" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Authenticate to Google Cloud without a key
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 490.0.0"

      - name: Confirm federated target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gcloud config get-value project)" == "$GCP_PROJECT_ID" ]]
          [[ "$(gcloud auth list --filter=status:ACTIVE --format='value(account)')" == "$DEPLOYER_SERVICE_ACCOUNT" ]]
          gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Build and push immutable application image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/production-release
          SOURCE_CREATED_AT="$(git show -s --format=%cI "$GITHUB_SHA")"
          IMAGE_TAG="$IMAGE_PATH:$GITHUB_SHA"
          docker build \
            --pull \
            --platform linux/amd64 \
            --target runner \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg SOURCE_CREATED_AT="$SOURCE_CREATED_AT" \
            --build-arg SOURCE_VERSION="production-${GITHUB_SHA:0:12}" \
            --build-arg SOURCE_STATE=clean \
            --tag "$IMAGE_TAG" \
            .
          [[ "$(docker inspect "$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" == "$GITHUB_SHA" ]]
          docker push "$IMAGE_TAG"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          IMAGE_REF="$IMAGE_PATH@$DIGEST"
          printf '%s\n' "$IMAGE_REF" > output/production-release/application-image.txt
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Build, verify, and push immutable production migration image
        id: migration_image
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_CREATED_AT="$(git show -s --format=%cI "$GITHUB_SHA")"
          MIGRATION_IMAGE_TAG="$MIGRATION_IMAGE_PATH:$GITHUB_SHA"
          docker build \
            --pull \
            --platform linux/amd64 \
            --target migration-runner \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg SOURCE_CREATED_AT="$SOURCE_CREATED_AT" \
            --build-arg SOURCE_VERSION="production-migration-${GITHUB_SHA:0:12}" \
            --build-arg SOURCE_STATE=clean \
            --build-arg MIGRATION_PACKAGE_TARGET=production \
            --tag "$MIGRATION_IMAGE_TAG" \
            .
          [[ "$(docker inspect "$MIGRATION_IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" == "$GITHUB_SHA" ]]
          docker run --rm "$MIGRATION_IMAGE_TAG" > output/production-release/migration-dry-run.json
          node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("output/production-release/migration-dry-run.json", "utf8"));
          if (report.mode !== "dry_run" || report.connectionAttempted !== false) throw new Error("PRODUCTION_MIGRATION_DRY_RUN_BOUNDARY_INVALID");
          if (report.schemaMigrationCount !== 38) throw new Error(`PRODUCTION_MIGRATION_COUNT_INVALID:${report.schemaMigrationCount}`);
          if (report.firstSchemaMigration !== "sql/001_initial_schema.cloudsql.sql" || report.lastSchemaMigration !== "sql/047_remove_bom_module.cloudsql.sql") {
            throw new Error("PRODUCTION_MIGRATION_RANGE_INVALID");
          }
          NODE
          docker push "$MIGRATION_IMAGE_TAG"
          MIGRATION_DIGEST="$(gcloud artifacts docker images describe "$MIGRATION_IMAGE_TAG" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$MIGRATION_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          MIGRATION_IMAGE_REF="$MIGRATION_IMAGE_PATH@$MIGRATION_DIGEST"
          printf '%s\n' "$MIGRATION_IMAGE_REF" > output/production-release/migration-image.txt
          echo "digest=$MIGRATION_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_ref=$MIGRATION_IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Deploy zero-traffic tagged candidate
        id: candidate
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          BEFORE_JSON=output/production-release/service-before.json
          AFTER_JSON=output/production-release/service-candidate.json
          REVISION_JSON=output/production-release/revision-candidate.json
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$BEFORE_JSON"
          PREVIOUS_REVISION="$(node scripts/select-production-serving-revision.mjs "$BEFORE_JSON")"
          DIRECT_BASE_URL="$(jq -r '.status.url' "$BEFORE_JSON")"
          [[ "$DIRECT_BASE_URL" =~ ^https://ai-pdm-prod-[a-z0-9-]+\.a\.run\.app$ ]]

          TAG="candidate"
          REVISION_SUFFIX="gh-${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --revision-suffix "$REVISION_SUFFIX" \
            --no-traffic \
            --tag "$TAG" \
            --quiet \
            --container "$APPLICATION_CONTAINER" \
            --update-env-vars "PDM_CANDIDATE_CLOUD_RUN_SERVICE=$CLOUD_RUN_SERVICE,PDM_CANDIDATE_CLOUD_RUN_TAG=$TAG,$CANDIDATE_RUNTIME_FLAGS" \
            --image "$IMAGE_REF"

          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$AFTER_JSON"
          CANDIDATE_REVISION="$(jq -r '.status.latestReadyRevisionName' "$AFTER_JSON")"
          CANDIDATE_URL="$(jq -r --arg tag "$TAG" '.status.traffic[] | select(.tag == $tag) | .url' "$AFTER_JSON")"
          [[ "$CANDIDATE_REVISION" =~ ^ai-pdm-prod-[a-z0-9-]{3,48}$ ]]
          [[ "$CANDIDATE_REVISION" != "$PREVIOUS_REVISION" ]]
          [[ "$CANDIDATE_URL" =~ ^https://[a-z0-9-]+---ai-pdm-prod-[a-z0-9-]+\.a\.run\.app$ ]]

          gcloud run revisions describe "$CANDIDATE_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$REVISION_JSON"
          CANDIDATE_IMAGE="$(jq -r --arg name "$APPLICATION_CONTAINER" '.spec.containers[] | select(.name == $name) | .image' "$REVISION_JSON")"
          [[ "$CANDIDATE_IMAGE" == "$IMAGE_REF" ]]
          assert_revision_env() {
            local env_name="$1"
            local expected="$2"
            local actual
            actual="$(jq -r --arg container "$APPLICATION_CONTAINER" --arg env_name "$env_name" '.spec.containers[] | select(.name == $container) | .env[]? | select(.name == $env_name) | .value' "$REVISION_JSON")"
            [[ "$actual" == "$expected" ]]
          }
          for flag in PDM_NUMBER_STATE_FLOW_V1 PDM_NUMBER_LIFECYCLE_V2 PDM_UNIFIED_DRAWING_WORKBENCH_V1 PDM_UNIFIED_PART_RELATION_WORKBENCH_V1 PDM_UNIFIED_ENTITY_DETAIL_V1; do
            assert_revision_env "$flag" "true"
          done
          assert_revision_env PDM_DRAWING_REVISION_LIFECYCLE_MODE enforced
          [[ "$(jq -r --arg tag "$TAG" '.status.traffic[] | select(.tag == $tag) | (.percent // 0)' "$AFTER_JSON")" == "0" ]]

          echo "previous_revision=$PREVIOUS_REVISION" >> "$GITHUB_OUTPUT"
          echo "candidate_revision=$CANDIDATE_REVISION" >> "$GITHUB_OUTPUT"
          echo "candidate_url=$CANDIDATE_URL" >> "$GITHUB_OUTPUT"
          echo "direct_base_url=$DIRECT_BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke zero-traffic candidate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-production-release-smoke.mjs \
            --kind candidate \
            --base-url "${{ steps.candidate.outputs.candidate_url }}" \
            --direct-base-url "${{ steps.candidate.outputs.direct_base_url }}" \
            --revision "${{ steps.candidate.outputs.candidate_revision }}" \
            --image-digest "${{ steps.image.outputs.digest }}" \
            --source-revision "$GITHUB_SHA" \
            --output output/production-release/candidate-smoke.json

      - name: Validate traffic-only promotion and rollback requests
        shell: bash
        env:
          PDM_PRODUCTION_EXPECTED_LATEST_REVISION: ${{ steps.candidate.outputs.candidate_revision }}
        run: |
          set -euo pipefail
          node scripts/run-production-release-traffic.mjs \
            --mode validate \
            --rollback-revision "${{ steps.candidate.outputs.previous_revision }}" \
            --expected-latest-revision "$PDM_PRODUCTION_EXPECTED_LATEST_REVISION" \
            --output-dir output/production-release

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-candidate-${{ github.sha }}-${{ github.run_id }}
          path: output/production-release
          if-no-files-found: error
          retention-days: 30

  promote:
    name: Verify Level 4 and Wave 0 test/waiver, then promote candidate
    if: ${{ inputs.stage == 'promote' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://jenfu-ai-pdm-prod.web.app
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: jenfu-ai-pdm-prod
      GCP_PROJECT_NUMBER: "451715062958"
      GCP_REGION: asia-east1
      CLOUD_RUN_SERVICE: ai-pdm-prod
      APPLICATION_CONTAINER: ai-pdm
      IMAGE_PATH: asia-east1-docker.pkg.dev/jenfu-ai-pdm-prod/ai-pdm/ai-pdm
      CANONICAL_BASE_URL: https://jenfu-ai-pdm-prod.web.app
      WIF_PROVIDER: projects/451715062958/locations/global/workloadIdentityPools/github-actions/providers/ai-pdm-production
      DEPLOYER_SERVICE_ACCOUNT: ai-pdm-prod-deployer@jenfu-ai-pdm-prod.iam.gserviceaccount.com
      PDM_PRODUCTION_RELEASE_TRAFFIC_APPROVAL: AI-PDM-PRODUCTION-RELEASE-TRAFFIC-APPROVED
      PDM_PRODUCTION_PROJECT_ID: jenfu-ai-pdm-prod
      PDM_PRODUCTION_REGION: asia-east1
      PDM_PRODUCTION_SERVICE: ai-pdm-prod
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0

      - name: Reconfirm source provenance
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_APPROVAL: ${{ inputs.approval }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$RELEASE_APPROVAL" == "DEPLOY-AI-PDM-PRODUCTION" ]]
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_COMMIT" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$RELEASE_COMMIT" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require candidate-bound Level 4 and Wave 0 test/waiver approvals
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
          LEVEL4_EVIDENCE_REF: ${{ inputs.level4_evidence_ref }}
          WAVE0_USERS: ${{ inputs.wave0_users }}
          WAVE0_MODE: ${{ inputs.wave0_mode }}
          WAVE0_WAIVER_REF: ${{ inputs.wave0_waiver_ref }}
          PRODUCT_OWNER_DECISION: ${{ inputs.product_owner_decision }}
          PROMOTION_APPROVAL: ${{ inputs.promotion_approval }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REVISION" =~ ^ai-pdm-prod-[a-z0-9-]{3,48}$ ]]
          EXPECTED_EVIDENCE_PREFIX="production-candidate://${CANDIDATE_REVISION}/${RELEASE_COMMIT}/"
          [[ "$LEVEL4_EVIDENCE_REF" == "$EXPECTED_EVIDENCE_PREFIX"* ]]
          EVIDENCE_ID="${LEVEL4_EVIDENCE_REF#"$EXPECTED_EVIDENCE_PREFIX"}"
          [[ "$EVIDENCE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$ ]]
          [[ "${LEVEL4_EVIDENCE_REF,,}" != *staging* ]]
          [[ "$WAVE0_MODE" == "tested" || "$WAVE0_MODE" == "waived" ]]
          if [[ "$WAVE0_MODE" == "tested" ]]; then
            [[ -z "$WAVE0_WAIVER_REF" ]]
            IFS=',' read -r -a users <<< "$WAVE0_USERS"
            (( ${#users[@]} >= 3 && ${#users[@]} <= 5 ))
            for user in "${users[@]}"; do
              user="${user//[[:space:]]/}"
              [[ "$user" =~ ^[^@[:space:]]+@[^@[:space:]]+$ ]]
            done
          else
            [[ -z "$WAVE0_USERS" ]]
            EXPECTED_WAIVER_PREFIX="WAVE0-WAIVER://${CANDIDATE_REVISION}/${RELEASE_COMMIT}/"
            [[ "$WAVE0_WAIVER_REF" == "$EXPECTED_WAIVER_PREFIX"* ]]
            WAIVER_ID="${WAVE0_WAIVER_REF#"$EXPECTED_WAIVER_PREFIX"}"
            [[ "$WAIVER_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$ ]]
            [[ "${WAVE0_WAIVER_REF,,}" != *staging* ]]
          fi
          [[ "$PRODUCT_OWNER_DECISION" == "go" ]]
          [[ "$PROMOTION_APPROVAL" == "AI-PDM-PRODUCTION-PROMOTION-APPROVED" ]]

      - name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 490.0.0"

      - name: Confirm candidate provenance and zero traffic
        id: context
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
          LEVEL4_EVIDENCE_REF: ${{ inputs.level4_evidence_ref }}
        run: |
          set -euo pipefail
          [[ "$(gcloud config get-value project)" == "$GCP_PROJECT_ID" ]]
          [[ "$(gcloud auth list --filter=status:ACTIVE --format='value(account)')" == "$DEPLOYER_SERVICE_ACCOUNT" ]]
          mkdir -p output/production-release
          SERVICE_JSON=output/production-release/service-before-promotion.json
          REVISION_JSON=output/production-release/revision-before-promotion.json
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$SERVICE_JSON"
          LATEST_READY="$(jq -r '.status.latestReadyRevisionName' "$SERVICE_JSON")"
          [[ "$LATEST_READY" == "$CANDIDATE_REVISION" ]]
          PREVIOUS_REVISION="$(node scripts/select-production-serving-revision.mjs "$SERVICE_JSON")"
          [[ "$PREVIOUS_REVISION" != "$CANDIDATE_REVISION" ]]
          CANDIDATE_PERCENT="$(jq -r --arg revision "$CANDIDATE_REVISION" '[.status.traffic[] | select((.revisionName // .revision) == $revision) | (.percent // 0)] | add // 0' "$SERVICE_JSON")"
          [[ "$CANDIDATE_PERCENT" == "0" ]]

          gcloud run revisions describe "$CANDIDATE_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > "$REVISION_JSON"
          EXPECTED_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_PATH:$RELEASE_COMMIT" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          EXPECTED_IMAGE="$IMAGE_PATH@$EXPECTED_DIGEST"
          CANDIDATE_IMAGE="$(jq -r --arg name "$APPLICATION_CONTAINER" '.spec.containers[] | select(.name == $name) | .image' "$REVISION_JSON")"
          [[ "$CANDIDATE_IMAGE" == "$EXPECTED_IMAGE" ]]
          assert_revision_env() {
            local env_name="$1"
            local expected="$2"
            local actual
            actual="$(jq -r --arg container "$APPLICATION_CONTAINER" --arg env_name "$env_name" '.spec.containers[] | select(.name == $container) | .env[]? | select(.name == $env_name) | .value' "$REVISION_JSON")"
            [[ "$actual" == "$expected" ]]
          }
          for flag in PDM_NUMBER_STATE_FLOW_V1 PDM_NUMBER_LIFECYCLE_V2 PDM_UNIFIED_DRAWING_WORKBENCH_V1 PDM_UNIFIED_PART_RELATION_WORKBENCH_V1 PDM_UNIFIED_ENTITY_DETAIL_V1; do
            assert_revision_env "$flag" "true"
          done
          assert_revision_env PDM_DRAWING_REVISION_LIFECYCLE_MODE enforced

          printf '%s\n' "$LEVEL4_EVIDENCE_REF" > output/production-release/authenticated-level4-evidence-ref.txt
          echo "candidate_revision=$CANDIDATE_REVISION" >> "$GITHUB_OUTPUT"
          echo "previous_revision=$PREVIOUS_REVISION" >> "$GITHUB_OUTPUT"
          echo "image_digest=$EXPECTED_DIGEST" >> "$GITHUB_OUTPUT"
          echo "direct_base_url=$(jq -r '.status.url' "$SERVICE_JSON")" >> "$GITHUB_OUTPUT"

      - name: Validate traffic-only promotion and rollback requests
        shell: bash
        env:
          PDM_PRODUCTION_EXPECTED_LATEST_REVISION: ${{ steps.context.outputs.candidate_revision }}
        run: |
          set -euo pipefail
          node scripts/run-production-release-traffic.mjs \
            --mode validate \
            --rollback-revision "${{ steps.context.outputs.previous_revision }}" \
            --expected-latest-revision "$PDM_PRODUCTION_EXPECTED_LATEST_REVISION" \
            --output-dir output/production-release

      - name: Promote approved candidate to production traffic
        shell: bash
        env:
          PDM_PRODUCTION_EXPECTED_LATEST_REVISION: ${{ steps.context.outputs.candidate_revision }}
        run: |
          set -euo pipefail
          node scripts/run-production-release-traffic.mjs \
            --mode promote-latest \
            --expected-latest-revision "$PDM_PRODUCTION_EXPECTED_LATEST_REVISION" \
            --output-dir output/production-release

      - name: Smoke Firebase Hosting canonical origin
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-production-release-smoke.mjs \
            --kind canonical \
            --base-url "$CANONICAL_BASE_URL" \
            --direct-base-url "${{ steps.context.outputs.direct_base_url }}" \
            --revision "${{ steps.context.outputs.candidate_revision }}" \
            --image-digest "${{ steps.context.outputs.image_digest }}" \
            --source-revision "${{ inputs.release_commit }}" \
            --output output/production-release/canonical-smoke.json

      - name: Roll back traffic after any promotion failure
        if: ${{ failure() && steps.context.outputs.candidate_revision != '' && steps.context.outputs.previous_revision != '' }}
        shell: bash
        env:
          PDM_PRODUCTION_EXPECTED_LATEST_REVISION: ${{ steps.context.outputs.candidate_revision }}
        run: |
          set -euo pipefail
          node scripts/run-production-release-traffic.mjs \
            --mode rollback-revision \
            --rollback-revision "${{ steps.context.outputs.previous_revision }}" \
            --expected-latest-revision "$PDM_PRODUCTION_EXPECTED_LATEST_REVISION" \
            --output-dir output/production-release
          curl --fail --silent --show-error --max-time 30 "$CANONICAL_BASE_URL/login" | grep -q "AI PDM"

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-promotion-${{ github.sha }}-${{ github.run_id }}
          path: output/production-release
          if-no-files-found: error
          retention-days: 30
