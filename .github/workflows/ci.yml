name: AI PDM CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ai-pdm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev012-postgres-cutover:
    name: DEV-012 Isolated PostgreSQL Cutover
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Build and verify the patched runtime
        run: docker build --target runtime-smoke --progress=plain .
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify provider and DEV-012 cutover against disposable PostgreSQL
        env:
          DEV012_ISOLATED_POSTGRES: "1"
          PDM_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          node scripts/qc-db-provider-postgres.mjs
          node --test scripts/dev012-production-data-cutover-postgres.test.mjs

  qc-full:
    name: Production Slice QC
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Reject high or critical production dependency findings
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Verify current production slice
        env:
          CI: true
          PDM_QC_PHASE2B_SKIP_STAGING_PREFLIGHT: "true"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm run test:dev-117:continuous
          npm run qc:source-boundary
          npm run qc:dev-121:route-policy-source
          npm run qc:dev-121:route-classification
          npm run qc:dev-121:inventory-runner
          node --test scripts/lib/dev121-ai-pdm-quiescence.test.mjs
          node --test scripts/dev121-principal-candidate-smoke.test.mjs
          npm run qc:dev-046-phase2b
          npm exec vitest run src/lib/pdm-workbench-authority-control.test.ts src/lib/platform-command-service.test.ts src/lib/repositories/pdm-work-review-async-repository.test.ts src/lib/storage-access-audit.principal.test.ts src/app/api/lifecycle/obsolete-impact/principal-obsolete-impact.test.ts src/app/api/numbering/duplicate-check/principal-duplicate-check.test.ts src/lib/repositories/numbering-async-repository.principal-duplicate-audit.test.ts src/app/api/numbering/series-codes/principal-read.test.ts 'src/app/api/numbering/roots/[rootCode]/append-policy/principal-read.test.ts' 'src/app/api/numbering/roots/[rootCode]/principal-root-detail.test.ts' 'src/app/api/numbering/roots/[rootCode]/principal-append.test.ts' src/app/api/numbering/records/preview/principal-read.test.ts src/app/api/search/principal-search.test.ts src/app/api/submissions/principal-submission-list.test.ts src/app/api/submissions/preflight-lock/route.principal.test.ts src/app/api/submissions/revision-suggestion/retired-revision-suggestion.test.ts src/app/api/submission-rules/active/route.principal.test.ts src/app/api/submission-readiness/resolve/route.principal.test.ts src/lib/jenfu-route-permission-map.test.ts src/lib/pdm-principal-canonical-workbench-read.test.ts 'src/app/api/submissions/[id]/principal-submission-detail.test.ts' 'src/app/api/submissions/[id]/files/[...filePath]/principal-file-read.test.ts' 'src/app/api/submissions/[id]/release-package/principal-release-package-read.test.ts'
          npm exec vitest run src/lib/jenfu-principal-http.test.ts src/lib/jenfu-principal-only-cohort-apply.test.ts src/app/api/admin/account-invitations/principal-enrollment-boundary.test.ts src/lib/platform-principal-command-snapshot.test.ts src/lib/jenfu-principal-acl-migration-plan.test.ts src/lib/jenfu-principal-cutover-local-source.test.ts src/lib/jenfu-principal-cutover-locks.test.ts src/lib/jenfu-principal-cutover-graph-check.test.ts src/lib/jenfu-principal-cutover-workspace-shadow.test.ts src/lib/jenfu-principal-cutover-source-seal.test.ts src/lib/repositories/principal-local-acl-repository.test.ts src/lib/jenfu-principal-permission-service.test.ts src/lib/numbering-permission-guard.principal.test.ts src/lib/numbering-company-context.principal.test.ts src/lib/numbering-company-permission.test.ts src/lib/numbering-permission-async.test.ts src/app/api/numbering/permissions/principal-permissions.test.ts src/lib/permissions.principal.test.ts 'src/app/api/numbering/approval-batches/[batchId]/principal-role-boundary.test.ts' src/app/api/numbering/search/principal-scope.test.ts src/app/api/numbering/drawings/resolve/principal-scope.test.ts src/app/api/numbering/drawings/principal-read.test.ts src/app/api/numbering/drawings/retired-drawing-source-routes.test.ts src/app/api/numbering/drawing-revisions/retired-routes.test.ts 'src/app/api/pdm/drawing-revision-works/[workId]/principal-read.test.ts' src/app/api/numbering/reports-principal-scope.test.ts 'src/app/api/numbering/roots/[rootCode]/submission-readiness/principal-read.test.ts'
          npm exec vitest run src/app/api/pdm/part-change-works/principal-part-work-routes.test.ts 'src/app/api/pdm/parts/[partId]/matrix-workspace/principal-matrix-read.test.ts' 'src/app/api/pdm/drawing-rd-branches/[branchId]/void-requests/principal-void.test.ts'
          npm exec vitest run 'src/app/api/pdm/review-requests/[requestId]/principal-review-detail.test.ts' 'src/app/api/pdm/review-requests/[requestId]/decisions/principal-decision.test.ts' 'src/app/api/pdm/review-requests/[requestId]/targets/principal-targets.test.ts'
          npm exec vitest run src/app/api/auth/me/principal-me.test.ts src/app/api/auth/logout/principal-logout.test.ts src/app/api/account/sessions/principal-sessions.test.ts 'src/app/api/account/sessions/[sessionId]/revoke/principal-revoke.test.ts' 'src/app/api/pdm/file-assets/[fileAssetId]/principal-review-file.test.ts'
          npm exec vitest run src/lib/drawing-revision-work-file.principal.test.ts src/lib/preview-derivatives.principal-provenance.test.ts 'src/app/api/parts/[partNumber]/attachments/principal-read.test.ts' src/lib/drawing-preview-asset.principal.test.ts src/lib/file-response.security.test.ts src/lib/google-cloud-file-storage.test.ts src/lib/master-attachment-principal-command.test.ts src/lib/master-attachment-response.principal.test.ts src/lib/repositories/master-attachment-company-read.test.ts
          npm run qc:pdm-principal-account-boundary
          npm run qc:pdm-production-slice-numbering-draft
          npm run qc:dev-032-production-iac-package
          npm run qc:dev-079:contract
          npm run qc:dev-079:owner-invariant
          npm run qc:dev-101:contract
          npm run qc:dev-101:package
          npm run qc:dev-101:qa-integrity
          npm run qc:production-deployment-pipeline

      - name: Verify owner release adapter and isolated production artifact
        run: npm run qc:dev-117:continuous
