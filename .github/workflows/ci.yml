name: AI PDM CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ai-pdm-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dev012-postgres-cutover:
    name: DEV-012 Isolated PostgreSQL Cutover
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve affected production slices
        id: slice
        env:
          PDM_SLICE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PDM_SLICE_HEAD_SHA: ${{ github.sha }}
        run: node scripts/plan-production-slice.mjs --github-output "$GITHUB_OUTPUT"

      - name: Verify slice routing contract
        run: node --test scripts/production-slice-plan.test.mjs

      - name: Build isolated runtime candidate
        if: steps.slice.outputs.full == 'true'
        run: docker build --target runtime-smoke --progress=plain .
      - name: Install dependencies without lifecycle scripts
        if: steps.slice.outputs.database == 'true'
        run: npm ci --ignore-scripts

      - name: Verify provider and DEV-012 cutover against disposable PostgreSQL
        if: steps.slice.outputs.database == 'true'
        env:
          DEV012_ISOLATED_POSTGRES: "1"
          PDM_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          node scripts/qc-db-provider-postgres.mjs
          node --test scripts/dev012-production-data-cutover-postgres.test.mjs

  qc-full:
    name: Production Slice QC
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve affected production slices
        id: slice
        env:
          PDM_SLICE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PDM_SLICE_HEAD_SHA: ${{ github.sha }}
        run: node scripts/plan-production-slice.mjs --github-output "$env:GITHUB_OUTPUT"

      - name: Verify slice routing contract
        run: node --test scripts/production-slice-plan.test.mjs

      - name: Install dependencies
        if: steps.slice.outputs.docs_only != 'true'
        run: npm ci

      - name: Build and verify DEV-125 Windows installer
        if: steps.slice.outputs.worker == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sourceRevision = (git rev-parse HEAD).Trim()
          $version = "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-dev125-windows-installer.ps1 -SourceRevision $sourceRevision -Version $version
          $env:DEV125_INSTALLER_ROOT = ".tmp/dev125-windows-installer"
          node --conditions=react-server --experimental-transform-types --experimental-loader ./scripts/qc-ts-path-loader.mjs --input-type=module -e "const m=await import('./src/lib/windows-service-installer.ts'); const r=await m.readWindowsServiceInstaller(process.env.DEV125_INSTALLER_ROOT); if(r.manifest.sourceRevision!==process.env.GITHUB_SHA) process.exit(3); console.log(JSON.stringify({status:'PASS',sha256:r.manifest.sha256,size:r.manifest.size}))"

      - name: Upload DEV-125 Windows installer evidence
        if: steps.slice.outputs.worker == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev125-windows-installer-${{ github.sha }}
          path: |
            .tmp/dev125-windows-installer/worker-downloads/windows-service/
            .tmp/dev125-windows-installer/build-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Install Playwright browser
        if: steps.slice.outputs.application == 'true'
        run: npx playwright install chromium

      - name: Reject high or critical production dependency findings
        if: steps.slice.outputs.dependency_audit == 'true'
        run: npm run audit:production

      - name: Lint
        if: steps.slice.outputs.lint == 'true'
        run: npm run lint

      - name: Verify affected release, authorization, database, and worker contracts
        if: steps.slice.outputs.full != 'true' && (steps.slice.outputs.release_core == 'true' || steps.slice.outputs.authorization == 'true' || steps.slice.outputs.database == 'true' || steps.slice.outputs.worker == 'true')
        env:
          CI: true
          PDM_SLICE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PDM_SLICE_HEAD_SHA: ${{ github.sha }}
        run: npm run test:production-slice:affected -- --profile ci

      - name: Verify role-policy editor and affected capability callers
        if: steps.slice.outputs.authorization == 'true'
        run: npm run test:dev-123:contracts

      - name: Verify release and infrastructure slice
        if: steps.slice.outputs.infrastructure == 'true'
        env:
          CI: true
          PDM_QC_PHASE2B_SKIP_STAGING_PREFLIGHT: "true"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm run qc:source-boundary
          npm run qc:dev-121:route-policy-source
          npm run qc:dev-121:route-classification
          npm run qc:dev-121:inventory-runner
          node --test scripts/lib/dev121-ai-pdm-quiescence.test.mjs scripts/lib/preview-worker-source.test.mjs scripts/lib/dev121-business-storage-plan.test.mjs scripts/lib/dev121-business-storage-readback.test.mjs scripts/lib/dev121-business-storage-saved-plan.test.mjs
          node --test scripts/dev121-principal-candidate-smoke.test.mjs scripts/dev121-smoke-credential-reauth.test.mjs
          npm run qc:dev-046-phase2b

      - name: Verify application and authorization slice
        if: steps.slice.outputs.application == 'true' || steps.slice.outputs.authorization == 'true'
        env:
          CI: true
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm exec vitest run src/lib/pdm-workbench-authority-control.test.ts src/lib/platform-command-service.test.ts src/lib/principal-readonly-share-command.test.ts src/lib/repositories/release-async-repository.share-audit.test.ts src/lib/repositories/pdm-work-review-async-repository.test.ts src/lib/storage-access-audit.principal.test.ts src/app/api/lifecycle/obsolete-impact/principal-obsolete-impact.test.ts src/app/api/numbering/duplicate-check/principal-duplicate-check.test.ts src/lib/repositories/numbering-async-repository.principal-duplicate-audit.test.ts src/app/api/numbering/series-codes/principal-read.test.ts 'src/app/api/numbering/roots/[rootCode]/append-policy/principal-read.test.ts' 'src/app/api/numbering/roots/[rootCode]/principal-root-detail.test.ts' 'src/app/api/numbering/roots/[rootCode]/principal-append.test.ts' src/app/api/numbering/records/preview/principal-read.test.ts src/app/api/search/principal-search.test.ts src/app/api/submissions/principal-submission-list.test.ts src/app/api/submissions/preflight-lock/route.principal.test.ts src/app/api/submissions/revision-suggestion/retired-revision-suggestion.test.ts src/app/api/submission-rules/active/route.principal.test.ts src/app/api/submission-readiness/resolve/route.principal.test.ts src/lib/jenfu-route-permission-map.test.ts src/lib/jenfu-rd-capabilities.test.ts src/lib/pdm-principal-canonical-workbench-read.test.ts src/components/canonical-numbering-create-action.test.tsx 'src/app/api/submissions/[id]/principal-submission-detail.test.ts' 'src/app/api/submissions/[id]/files/[...filePath]/principal-file-read.test.ts' 'src/app/api/submissions/[id]/release-package/principal-release-package-read.test.ts'
          npm exec vitest run src/lib/jenfu-principal-http.test.ts src/lib/jenfu-principal-only-cohort-apply.test.ts src/app/api/admin/account-invitations/principal-enrollment-boundary.test.ts src/lib/platform-principal-command-snapshot.test.ts src/lib/jenfu-principal-acl-migration-plan.test.ts src/lib/jenfu-principal-cutover-local-source.test.ts src/lib/jenfu-principal-cutover-locks.test.ts src/lib/jenfu-principal-cutover-graph-check.test.ts src/lib/jenfu-principal-cutover-workspace-shadow.test.ts src/lib/jenfu-principal-cutover-source-seal.test.ts src/lib/repositories/principal-local-acl-repository.test.ts src/lib/jenfu-principal-permission-service.test.ts src/lib/numbering-permission-guard.principal.test.ts src/lib/numbering-company-context.principal.test.ts src/lib/numbering-company-permission.test.ts src/lib/numbering-permission-async.test.ts src/app/api/numbering/permissions/principal-permissions.test.ts src/lib/permissions.principal.test.ts 'src/app/api/numbering/approval-batches/[batchId]/principal-role-boundary.test.ts' src/app/api/numbering/search/principal-scope.test.ts src/app/api/numbering/drawings/resolve/principal-scope.test.ts src/app/api/numbering/drawings/principal-read.test.ts src/app/api/numbering/drawings/retired-drawing-source-routes.test.ts src/app/api/numbering/drawing-revisions/retired-routes.test.ts 'src/app/api/pdm/drawing-revision-works/[workId]/principal-read.test.ts' src/app/api/numbering/reports-principal-scope.test.ts 'src/app/api/numbering/roots/[rootCode]/submission-readiness/principal-read.test.ts' 'src/app/api/public/shares/[token]/principal-share-access.test.ts'
          npm exec vitest run src/app/api/pdm/part-change-works/principal-part-work-routes.test.ts 'src/app/api/pdm/parts/[partId]/matrix-workspace/principal-matrix-read.test.ts' 'src/app/api/pdm/drawing-rd-branches/[branchId]/void-requests/principal-void.test.ts'
          npm exec vitest run src/components/canonical-workspace-error-feedback.test.tsx 'src/app/api/pdm/review-requests/[requestId]/principal-review-detail.test.ts' 'src/app/api/pdm/review-requests/[requestId]/decisions/principal-decision.test.ts' 'src/app/api/pdm/review-requests/[requestId]/targets/principal-targets.test.ts'
          npm exec vitest run src/app/api/handoff/handoff-principal.test.ts src/app/api/integrations/procurement/releases/principal-releases.test.ts src/lib/repositories/handoff-async-repository.principal.test.ts
          npm exec vitest run src/app/api/auth/me/principal-me.test.ts src/app/api/auth/logout/principal-logout.test.ts src/app/api/account/sessions/principal-sessions.test.ts 'src/app/api/account/sessions/[sessionId]/revoke/principal-revoke.test.ts' 'src/app/api/pdm/file-assets/[fileAssetId]/principal-review-file.test.ts'
          npm exec vitest run src/lib/settings-secret-lifecycle.principal.test.ts src/app/api/settings/principal-secret-commands.test.ts src/lib/worker-service-auth.test.ts src/app/api/preview-jobs/claim/route.workload.test.ts 'src/app/api/preview-jobs/[jobId]/content/route.principal.test.ts' src/lib/preview-worker-source.principal.test.ts src/lib/drawing-revision-work-file.principal.test.ts src/lib/preview-derivatives.principal-provenance.test.ts 'src/app/api/parts/[partNumber]/attachments/principal-read.test.ts' src/lib/drawing-preview-asset.principal.test.ts src/lib/file-response.security.test.ts src/lib/google-cloud-file-storage.test.ts src/lib/master-attachment-principal-command.test.ts src/lib/master-attachment-response.principal.test.ts src/lib/repositories/master-attachment-company-read.test.ts
          npm exec vitest run src/lib/production-slice.principal-workbench.test.ts src/lib/jenfu-principal-provision-service.test.ts src/lib/jenfu-principal-provision-contract.test.ts src/lib/jenfu-principal-candidate-repository.test.ts src/lib/jenfu-principal-account-repository.test.ts src/lib/jenfu-principal-request-guard.test.ts src/lib/jenfu-sso-principal-callback.test.ts src/lib/jenfu-principal-handoff-session-service.test.ts
          npm run qc:pdm-principal-account-boundary
          npm run qc:pdm-production-slice-numbering-draft

      - name: Verify infrastructure package slice
        if: steps.slice.outputs.infrastructure == 'true' || steps.slice.outputs.full == 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm run qc:dev-032-production-iac-package

      - name: Verify preview and recognition slice
        if: steps.slice.outputs.preview == 'true' || steps.slice.outputs.recognition == 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm exec vitest run src/lib/drawing-recognition-reader.error.test.ts src/lib/production-slice.recognition-worker.test.ts src/lib/production-slice.settings.test.ts src/lib/worker-service-auth.test.ts
          npm exec vitest run src/lib/preview-worker-lease.test.ts src/lib/preview-worker-client.test.ts src/components/canonical-preview-media.cancelled.test.tsx src/app/api/preview-jobs/claim/route.workload.test.ts 'src/app/api/preview-jobs/[jobId]/complete/route.workload.test.ts' 'src/app/api/preview-jobs/[jobId]/heartbeat/route.workload.test.ts' 'src/app/api/preview-jobs/[jobId]/content/route.principal.test.ts' src/lib/preview-worker-source.principal.test.ts src/lib/preview-derivatives.principal-provenance.test.ts src/lib/preview-derivatives.dev122-recovery.test.ts src/lib/pdm-canonical-preview.pdf.test.ts src/components/canonical-preview-media.dev122.test.tsx src/components/canonical-preview-media.pdf.test.tsx src/components/pdf-document-viewport.test.ts src/components/pdf-document-viewport.lifecycle.test.tsx src/lib/drawing-recognition-principal-mutation.test.ts src/app/api/numbering/recognition-sessions/principal-create.test.ts src/app/api/numbering/recognition-sessions/principal-rerun.test.ts src/lib/repositories/drawing-recognition-async-repository.principal-provenance.test.ts src/components/drawing-recognition-workspace-panel.permission.test.tsx
          npm run qc:dev-079:contract
          npm exec vitest run src/lib/pdm-canonical-workbench.preview.test.ts src/lib/drawing-recognition-adapters.test.ts src/lib/drawing-recognition-browser-baseline.test.ts src/lib/pdm-file-ownership.media-type.test.ts src/components/canonical-pdm-workbench.preview-detail.test.tsx src/components/drawing-recognition-pdf-ocr.media-type.test.tsx
          npm run qc:dev-079:owner-invariant

      - name: Verify shared release package contracts
        if: steps.slice.outputs.infrastructure == 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm run qc:dev-101:contract
          npm run qc:dev-101:package
          npm run qc:dev-101:qa-integrity
          npm run qc:production-deployment-pipeline

      - name: Verify abort controller
        if: steps.slice.outputs.abort_controller == 'true'
        run: npm run test:dev-117:abort

      - name: Verify affected database boundary
        if: steps.slice.outputs.full != 'true' && steps.slice.outputs.db_boundary == 'true'
        run: npm run check:db-boundary

      - name: Verify isolated application candidate
        if: steps.slice.outputs.full != 'true' && steps.slice.outputs.isolated_build == 'true'
        run: |
          npm run typecheck:app
          npm run build:isolated

      - name: Verify full isolated release candidate
        if: steps.slice.outputs.full == 'true'
        run: npm run qc:dev-117:continuous
