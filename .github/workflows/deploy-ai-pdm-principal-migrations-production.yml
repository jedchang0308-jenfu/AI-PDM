name: Run AI-PDM protected migration or applied continuation

on:
  workflow_dispatch:
    inputs:
      releaseCapsuleRef:
        description: Immutable AI-PDM release, applied-continuation template, or RD-ledger-readback capsule with sha256 fragment
        required: true
        type: string

concurrency:
  group: production-release-ai-pdm-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  WIF_PROVIDER: ${{ vars.AIPDM_PROD_WIF_PROVIDER }}
  PDM_APPLIED_MIGRATION_CONTINUATION_RELEASE: "true"

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    permissions: { actions: read, contents: read, pull-requests: read, checks: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24.11.0", cache: npm }
      - run: npm ci
      - name: Verify exact merged source and required CI results
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: node scripts/dev012-verify-official-source.mjs
      - id: bind
        shell: bash
        env: { RELEASE_CAPSULE_REF: "${{ inputs.releaseCapsuleRef }}" }
        run: |
          set -euo pipefail
          capsule_uri="${RELEASE_CAPSULE_REF%%#sha256=*}"
          capsule_sha256="${RELEASE_CAPSULE_REF##*#sha256=}"
          test "$capsule_uri" != "$RELEASE_CAPSULE_REF"
          [[ "$capsule_uri" =~ ^gs://jenfu-platform-prod-aipdm-release/receipts/.+\.json$ ]]
          [[ "$capsule_sha256" =~ ^[a-f0-9]{64}$ ]]
          echo "capsule_uri=$capsule_uri" >> "$GITHUB_OUTPUT"
          echo "capsule_sha256=$capsule_sha256" >> "$GITHUB_OUTPUT"
      - id: verifier_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-verifier@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: classify
        name: Classify immutable input capsule
        shell: bash
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.verifier_auth.outputs.access_token }}"
        run: node scripts/dev122-rd-permission-ledger-readback.mjs --stage classify --capsule-ref "${{ steps.bind.outputs.capsule_uri }}" --capsule-sha256 "${{ steps.bind.outputs.capsule_sha256 }}" >> "$GITHUB_OUTPUT"
      - id: builder_auth
        if: ${{ steps.classify.outputs.kind == 'release' || steps.classify.outputs.kind == 'applied_release' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-builder@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: deployer_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-deployer@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: capsule
        name: Reuse or refresh the immutable applied-continuation capsule
        if: ${{ steps.classify.outputs.kind == 'release' || steps.classify.outputs.kind == 'applied_release' }}
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.verifier_auth.outputs.access_token }}"
          AIPDM_REFRESH_BUILDER_TOKEN: "${{ steps.builder_auth.outputs.access_token }}"
          AIPDM_REFRESH_DEPLOYER_TOKEN: "${{ steps.deployer_auth.outputs.access_token }}"
        run: node scripts/dev122-applied-continuation-capsule-refresh.mjs --capsule-ref "${{ inputs.releaseCapsuleRef }}"
      - id: effective
        name: Select the verified effective capsule
        shell: bash
        env:
          BOUND_URI: "${{ steps.bind.outputs.capsule_uri }}"
          BOUND_SHA256: "${{ steps.bind.outputs.capsule_sha256 }}"
          REFRESHED_URI: "${{ steps.capsule.outputs.capsule_uri }}"
          REFRESHED_SHA256: "${{ steps.capsule.outputs.capsule_sha256 }}"
        run: |
          echo "capsule_uri=${REFRESHED_URI:-$BOUND_URI}" >> "$GITHUB_OUTPUT"
          echo "capsule_sha256=${REFRESHED_SHA256:-$BOUND_SHA256}" >> "$GITHUB_OUTPUT"
      - id: prepare
        name: Execute prepare
        if: ${{ steps.classify.outputs.kind == 'release' || steps.classify.outputs.kind == 'applied_release' }}
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.verifier_auth.outputs.access_token }}"
          AIPDM_OWNER_PROOF_BUILDER_READ_TOKEN: "${{ steps.builder_auth.outputs.access_token }}"
          AIPDM_MIGRATION_EXECUTION_READ_TOKEN: "${{ steps.deployer_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage prepare --capsule-ref "${{ steps.effective.outputs.capsule_uri }}" --capsule-sha256 "${{ steps.effective.outputs.capsule_sha256 }}"
      - id: build
        name: Execute build
        if: ${{ steps.classify.outputs.kind == 'release' || steps.classify.outputs.kind == 'applied_release' }}
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.builder_auth.outputs.access_token }}"
          AIPDM_BUILD_VERIFIER_READ_TOKEN: "${{ steps.verifier_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage build --capsule-ref "${{ steps.effective.outputs.capsule_uri }}" --capsule-sha256 "${{ steps.effective.outputs.capsule_sha256 }}"
      - id: migrate
        name: Execute migrate
        if: ${{ steps.classify.outputs.kind == 'release' || steps.classify.outputs.kind == 'applied_release' }}
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.deployer_auth.outputs.access_token }}"
          AIPDM_OWNER_PROOF_BUILDER_READ_TOKEN: "${{ steps.builder_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage migrate --capsule-ref "${{ steps.effective.outputs.capsule_uri }}" --capsule-sha256 "${{ steps.effective.outputs.capsule_sha256 }}"
      - name: Execute RD ledger readback
        if: ${{ steps.classify.outputs.kind == 'rd_readback' }}
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.deployer_auth.outputs.access_token }}"
        run: node scripts/dev122-rd-permission-ledger-readback.mjs --stage readback --capsule-ref "${{ steps.effective.outputs.capsule_uri }}" --capsule-sha256 "${{ steps.effective.outputs.capsule_sha256 }}"
      - id: candidate_deployer_auth
        if: ${{ steps.classify.outputs.kind == 'applied_release' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-deployer@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: candidate_builder_read_auth
        if: ${{ steps.classify.outputs.kind == 'applied_release' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-builder@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: candidate
        name: Execute candidate
        if: ${{ steps.classify.outputs.kind == 'applied_release' }}
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.candidate_deployer_auth.outputs.access_token }}"
          AIPDM_OWNER_PROOF_BUILDER_READ_TOKEN: "${{ steps.candidate_builder_read_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage candidate --capsule-ref "${{ steps.effective.outputs.capsule_uri }}" --capsule-sha256 "${{ steps.effective.outputs.capsule_sha256 }}"
      - id: entrypoint
        name: Execute entrypoint
        if: ${{ steps.classify.outputs.kind == 'applied_release' }}
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.candidate_deployer_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage entrypoint --capsule-ref "${{ steps.effective.outputs.capsule_uri }}" --capsule-sha256 "${{ steps.effective.outputs.capsule_sha256 }}"
      - id: candidate_verifier_auth
        if: ${{ steps.classify.outputs.kind == 'applied_release' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-verifier@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: verify
        name: Execute verify
        if: ${{ steps.classify.outputs.kind == 'applied_release' }}
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.candidate_verifier_auth.outputs.access_token }}"
          AIPDM_OWNER_PROOF_BUILDER_READ_TOKEN: "${{ steps.candidate_builder_read_auth.outputs.access_token }}"
          DEV012_AIPDM_FIREBASE_REFRESH_TOKEN: "${{ secrets.DEV012_AIPDM_FIREBASE_REFRESH_TOKEN }}"
          DEV012_AIPDM_FIREBASE_API_KEY: "${{ secrets.DEV012_AIPDM_FIREBASE_API_KEY }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage verify --capsule-ref "${{ steps.effective.outputs.capsule_uri }}" --capsule-sha256 "${{ steps.effective.outputs.capsule_sha256 }}"
      - id: decision
        name: Execute decision
        if: ${{ steps.classify.outputs.kind == 'applied_release' }}
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.candidate_verifier_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage decision --capsule-ref "${{ steps.effective.outputs.capsule_uri }}" --capsule-sha256 "${{ steps.effective.outputs.capsule_sha256 }}"
      - id: activation_deployer_auth
        if: ${{ steps.classify.outputs.kind == 'applied_release' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-deployer@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: activation_builder_read_auth
        if: ${{ steps.classify.outputs.kind == 'applied_release' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-builder@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: activate
        name: Execute activate
        if: ${{ steps.classify.outputs.kind == 'applied_release' }}
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.activation_deployer_auth.outputs.access_token }}"
          AIPDM_OWNER_PROOF_BUILDER_READ_TOKEN: "${{ steps.activation_builder_read_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage activate --capsule-ref "${{ steps.effective.outputs.capsule_uri }}" --capsule-sha256 "${{ steps.effective.outputs.capsule_sha256 }}"
      - id: activation_verifier_auth
        if: ${{ steps.classify.outputs.kind == 'applied_release' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-verifier@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: canonical
        name: Execute canonical
        if: ${{ steps.classify.outputs.kind == 'applied_release' }}
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.activation_verifier_auth.outputs.access_token }}"
          DEV012_AIPDM_FIREBASE_REFRESH_TOKEN: "${{ secrets.DEV012_AIPDM_FIREBASE_REFRESH_TOKEN }}"
          DEV012_AIPDM_FIREBASE_API_KEY: "${{ secrets.DEV012_AIPDM_FIREBASE_API_KEY }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage canonical --capsule-ref "${{ steps.effective.outputs.capsule_uri }}" --capsule-sha256 "${{ steps.effective.outputs.capsule_sha256 }}"
      - id: finalize
        name: Execute finalize
        if: ${{ steps.classify.outputs.kind == 'applied_release' }}
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.activation_deployer_auth.outputs.access_token }}"
          AIPDM_OWNER_PROOF_BUILDER_READ_TOKEN: "${{ steps.activation_builder_read_auth.outputs.access_token }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage finalize --capsule-ref "${{ steps.effective.outputs.capsule_uri }}" --capsule-sha256 "${{ steps.effective.outputs.capsule_sha256 }}"
      - id: rollback_deployer_auth
        if: ${{ failure() && steps.classify.outputs.kind == 'applied_release' && (steps.prepare.outcome == 'success' || steps.prepare.outcome == 'failure') }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-deployer@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - id: rollback_builder_read_auth
        if: ${{ failure() && steps.classify.outputs.kind == 'applied_release' && (steps.prepare.outcome == 'success' || steps.prepare.outcome == 'failure') }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: aipdm-prod-builder@jenfu-platform-prod.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Recover applied-continuation release failure
        if: ${{ failure() && steps.classify.outputs.kind == 'applied_release' && (steps.prepare.outcome == 'success' || steps.prepare.outcome == 'failure') }}
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "${{ steps.rollback_deployer_auth.outputs.access_token }}"
          AIPDM_OWNER_PROOF_BUILDER_READ_TOKEN: "${{ steps.rollback_builder_read_auth.outputs.access_token }}"
          PDM_RELEASE_FAILURE_CODE: "${{ steps.prepare.outputs.failure_code || steps.build.outputs.failure_code || steps.migrate.outputs.failure_code || steps.candidate.outputs.failure_code || steps.entrypoint.outputs.failure_code || steps.verify.outputs.failure_code || steps.decision.outputs.failure_code || steps.activate.outputs.failure_code || steps.canonical.outputs.failure_code || steps.finalize.outputs.failure_code || 'WORKFLOW_JOB_FAILURE' }}"
        run: node scripts/dev117-ai-pdm-continuous-release.mjs --stage rollback --capsule-ref "${{ steps.effective.outputs.capsule_uri }}" --capsule-sha256 "${{ steps.effective.outputs.capsule_sha256 }}"
