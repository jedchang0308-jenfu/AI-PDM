- main:
  - heading "圖料工作台" [level=1]
  - button "重新整理":
    - img
    - text: 重新整理
  - button "建立編號"
  - text: 搜尋
  - img
  - textbox "搜尋":
    - /placeholder: 圖料根號、料號、圖號、名稱
  - text: 範圍
  - combobox "範圍":
    - option "全部" [selected]
    - option "我的待處理"
    - option "工作中"
  - text: 工作狀態
  - combobox "工作狀態":
    - option "全部工作狀態" [selected]
    - option "待你處理"
    - option "等他人處理"
    - option "系統處理中"
    - option "生產可用"
    - option "研發可用"
    - option "可用範圍待確認"
    - option "負責人待確認"
    - option "歷史"
  - text: 系列代號
  - combobox "系列代號":
    - option "全部系列" [selected]
    - option "JF"
  - text: 類型
  - combobox "類型":
    - option "全部" [selected]
    - option "圖料根號"
    - option "料號"
    - option "圖號"
  - text: 資料狀態
  - combobox "資料狀態":
    - option "全部狀態" [selected]
    - option "Draft"
    - option "NeedInfo"
    - option "Active"
    - option "PendingReview"
    - option "Released"
    - option "Rejected"
    - option "Obsolete"
    - option "Merged"
    - option "PendingAdminConfirm"
    - option "MainDrawingInvalid"
  - checkbox "包含歷史 顯示已取消、已作廢與已合併紀錄"
  - text: 包含歷史 顯示已取消、已作廢與已合併紀錄
  - tablist "圖料關係顯示模式":
    - tab "關係樹" [selected]
    - tab "矩陣"
  - row "編號排序，目前遞增，點擊切換為遞減 工作狀態":
    - columnheader "編號排序，目前遞增，點擊切換為遞減":
      - button "編號排序，目前遞增，點擊切換為遞減": 編號
    - text: 工作狀態
