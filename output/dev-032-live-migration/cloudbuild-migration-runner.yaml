steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - migration-runner
      - --build-arg
      - MIGRATION_PACKAGE_TARGET=production
      - --build-arg
      - SOURCE_REVISION=${_SOURCE_REVISION}
      - --build-arg
      - SOURCE_CREATED_AT=${_SOURCE_CREATED_AT}
      - --build-arg
      - SOURCE_VERSION=${_SOURCE_VERSION}
      - --build-arg
      - SOURCE_STATE=clean
      - --tag
      - ${_IMAGE_URI}
      - .
images:
  - ${_IMAGE_URI}
options:
  logging: CLOUD_LOGGING_ONLY
